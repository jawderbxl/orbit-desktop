# Construit et publie Orbit PC. L'app installee se met ensuite a jour toute seule.
# A lancer depuis GitHub : onglet Actions -> Release PC -> Run workflow.
name: Release PC
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
